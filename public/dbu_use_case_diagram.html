      </text>
      
      <text x="0" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1E293B">
        2. <tspan font-weight="700" fill="#0F172A">Automated Identification Pipeline:</tspan> Register Assets inherently executes &lt;&lt;include&gt;&gt; Generate / Print QR Code, Generate Asset Barcode, and Upload Asset Images.
      </text>

      <text x="0" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1E293B">
        3. <tspan font-weight="700" fill="#0F172A">Public Asset Verification Autonomy:</tspan> Public Asset Verification extends Scan QR Code for public/external stakeholders without requiring login credentials.
      </text>

      <text x="0" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1E293B">
        4. <tspan font-weight="700" fill="#0F172A">Immutable Lifecycle Audit Trail:</tspan> Track Asset History centrally logs all state changes triggered by Assignment, Transfer, Return, Maintenance Updates, and Inventory Audits.
      </text>

      <text x="0" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1E293B">
        5. <tspan font-weight="700" fill="#0F172A">Financial Depreciation Engine:</tspan> Calculate Depreciation provides real-time straight-line/declining asset book valuation feeding University Capital Valuation and Financial Reports.
      </text>
    </g>
