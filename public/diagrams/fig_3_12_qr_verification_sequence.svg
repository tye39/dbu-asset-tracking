<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" width="1080" height="680">
  <defs>
    <marker id="qr_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E3A8A"/>
    </marker>
    <marker id="qr_arrow_ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1080" height="680" fill="#FFFFFF"/>

  <!-- Title Header -->
  <text x="540" y="35" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#0F172A">
    Figure 3.12: Sequence Diagram – Privacy-Preserving Public QR Verification
  </text>
  <text x="540" y="58" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#64748B">
    Edge Middleware Whitelisting, IP Rate Limiting, Selective Column Projection &amp; Name Masking
  </text>

  <!-- PARTICIPANTS -->
  <!-- 1. Public Visitor -->
  <g transform="translate(40, 80)">
    <rect width="130" height="36" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <text x="65" y="23" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Public Visitor</text>
    <line x1="65" y1="36" x2="65" y2="550" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 2. Mobile Browser -->
  <g transform="translate(220, 80)">
    <rect width="140" height="36" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
    <text x="70" y="23" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#0369A1">:MobileBrowser</text>
    <line x1="70" y1="36" x2="70" y2="550" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 3. Edge Middleware -->
  <g transform="translate(410, 80)">
    <rect width="150" height="36" rx="6" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="75" y="23" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#6B21A8">:EdgeMiddleware</text>
    <line x1="75" y1="36" x2="75" y2="550" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 4. PublicAssetService -->
  <g transform="translate(610, 80)">
    <rect width="180" height="36" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="90" y="23" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#15803D">:PublicAssetService</text>
    <line x1="90" y1="36" x2="90" y2="550" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 5. Neon PostgreSQL DB -->
  <g transform="translate(840, 80)">
    <rect width="140" height="36" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="70" y="23" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#B45309">:Prisma (DB)</text>
    <line x1="70" y1="36" x2="70" y2="550" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- ACTIVATION BARS -->
  <rect x="100" y="140" width="10" height="390" fill="#E2E8F0" stroke="#64748B"/>
  <rect x="285" y="150" width="10" height="360" fill="#BAE6FD" stroke="#0284C7"/>
  <rect x="480" y="170" width="10" height="80" fill="#E9D5FF" stroke="#7C3AED"/>
  <rect x="695" y="240" width="10" height="230" fill="#BBF7D0" stroke="#16A34A"/>
  <rect x="905" y="300" width="10" height="70" fill="#FEF3C7" stroke="#D97706"/>

  <!-- MESSAGE 1: Scan Physical QR -->
  <line x1="110" y1="155" x2="285" y2="155" stroke="#1E3A8A" stroke-width="1.5" marker-end="url(#qr_arrow)"/>
  <text x="197" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1E3A8A">1: Scan Physical QR Tag</text>

  <!-- MESSAGE 2: HTTP GET /asset/verify/[publicId] -->
  <line x1="295" y1="175" x2="480" y2="175" stroke="#1E3A8A" stroke-width="1.5" marker-end="url(#qr_arrow)"/>
  <text x="387" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1E3A8A">2: GET /asset/verify/[publicId]</text>

  <!-- MESSAGE 3: Edge Route Check -->
  <path d="M 490 190 L 530 190 L 530 205 L 490 205" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#qr_arrow)"/>
  <text x="540" y="202" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#6B21A8">3: Whitelist check: allow public</text>

  <!-- MESSAGE 4: Forward to Page Controller -->
  <line x1="490" y1="240" x2="695" y2="240" stroke="#1E3A8A" stroke-width="1.5" marker-end="url(#qr_arrow)"/>
  <text x="592" y="233" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#1E3A8A">4: getPublicAssetVerification(publicId)</text>

  <!-- MESSAGE 5: Rate Limiting Check -->
  <path d="M 705 255 L 750 255 L 750 270 L 705 270" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#qr_arrow)"/>
  <text x="760" y="267" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#15803D">5: checkVerificationRateLimit(ip)</text>

  <!-- MESSAGE 6: Selective DB Query -->
  <line x1="705" y1="300" x2="905" y2="300" stroke="#1E3A8A" stroke-width="1.5" marker-end="url(#qr_arrow)"/>
  <text x="805" y="293" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#1E3A8A">6: findFirst(where publicId, deletedAt: null)</text>
  <text x="805" y="318" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748B">select: { name, code, status, dept, location }</text>

  <!-- MESSAGE 7: Return Database Record -->
  <line x1="905" y1="350" x2="705" y2="350" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#qr_arrow_ret)"/>
  <text x="805" y="343" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#059669">7: rawRecord (costs omitted)</text>

  <!-- MESSAGE 8: Apply Privacy Masking -->
  <path d="M 705 380 L 760 380 L 760 400 L 705 400" fill="none" stroke="#16A34A" stroke-width="1.5" marker-end="url(#qr_arrow)"/>
  <text x="770" y="392" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#15803D">8: maskPersonName("Abebe Kebede")</text>
  <text x="770" y="405" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#047857">-&gt; "Abebe K." (Email/UUID Excluded)</text>

  <!-- MESSAGE 9: Return Public Verification Payload -->
  <line x1="695" y1="440" x2="295" y2="440" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#qr_arrow_ret)"/>
  <text x="495" y="433" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">9: PublicPayload (Certified Status, Masked Custodian)</text>

  <!-- MESSAGE 10: Render Public Card -->
  <line x1="285" y1="480" x2="110" y2="480" stroke="#16A34A" stroke-width="1.5" marker-end="url(#qr_arrow)"/>
  <text x="197" y="472" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#15803D">10: Display Verification Card</text>
  <text x="197" y="495" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#047857">Zero sensitive financial/personal leaks</text>

  <!-- Bottom Labels -->
  <g transform="translate(40, 565)">
    <rect width="130" height="26" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1"/>
    <text x="65" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Public Visitor</text>
  </g>
  <g transform="translate(220, 565)">
    <rect width="140" height="26" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
    <text x="70" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#0369A1">:MobileBrowser</text>
  </g>
  <g transform="translate(410, 565)">
    <rect width="150" height="26" rx="6" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1"/>
    <text x="75" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#6B21A8">:EdgeMiddleware</text>
  </g>
  <g transform="translate(610, 565)">
    <rect width="180" height="26" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
    <text x="90" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#15803D">:PublicAssetService</text>
  </g>
  <g transform="translate(840, 565)">
    <rect width="140" height="26" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
    <text x="70" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#B45309">:Prisma (DB)</text>
  </g>
</svg>
